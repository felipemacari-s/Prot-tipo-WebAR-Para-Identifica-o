<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR - Manutenção Industrial</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js"></script>
</head>
<body>
    <!-- Painel de UI -->
    <div id="painel-info" class="oculto">
        <button id="btn-fechar">✖</button>
        <h2 id="painel-titulo">Informação</h2>
        <div id="painel-conteudo"></div>
    </div>

    <!-- Cena WebAR -->
    <a-scene mindar-image="imageTargetSrc: ./assets/targets/robo.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <!-- O cursor (raycaster) movido para FORA da câmara para detetar o ecrã tátil -->
        <a-entity cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .interativo"></a-entity>

        <a-entity mindar-image-target="targetIndex: 0" id="target-robo">
            <!-- Aumentámos o radius para 0.25 e adicionámos o nosso componente hotspot-clicavel -->
            <a-circle class="interativo" hotspot-clicavel="tipo: identificacao" color="#2196F3" radius="0.25" position="-0.7 0.7 0"></a-circle>
            <a-circle class="interativo" hotspot-clicavel="tipo: componentes" color="#4CAF50" radius="0.25" position="0.7 0.7 0"></a-circle>
            <a-circle class="interativo" hotspot-clicavel="tipo: manutencao" color="#FFEB3B" radius="0.25" position="-0.7 -0.7 0"></a-circle>
            <a-circle class="interativo" hotspot-clicavel="tipo: monitoramento" color="#f59e0b" radius="0.25" position="0.7 -0.7 0"></a-circle>
        </a-entity>
    </a-scene>
</body>
</html>
