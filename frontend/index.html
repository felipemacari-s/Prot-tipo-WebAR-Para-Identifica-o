<!DOCTYPE html>
<html lang="pt-BR">

<head>
      
    <meta charset="UTF-8">
      
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
      <title>RA | Manual Interativo do Torno CNC</title>
      <!-- 
  =========================================================
  CSS DA INTERFACE
  ========================================================= -->
      
    <link rel="stylesheet" href="css/style.css">
      <!-- 
  =========================================================
  BIBLIOTECAS DA REALIDADE AUMENTADA
  A-Frame: cena 3D
  MindAR: reconhecimento e rastreamento do target
  ========================================================= 
  -->
      
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
      
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
      
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
      
    <script>eruda.init();</script>
</head>

<body>
      <header id="hud">
            <div class="hud-text">
                  <strong>ROBÔ INDUSTRIAL</strong>
                  <span id="status">Toque em INICIAR para habilitar a câmera</span>
                </div>
            <!-- Transformado em botão -->
            <button id="badge"
                  style="cursor: pointer; border: none; pointer-events: auto; position: relative; z-index: 999999">▶
                  INICIAR</button>
          </header>
      <div id="hotspot-layer">
            <button class="hotspot" type="button" data-topic="cabeca" data-x="0.00" data-y="0.10" data-z="0.03"
                  aria-label="Cabeça e sensores">
                  1
                </button>
            <button class="hotspot" type="button" data-topic="tronco" data-x="0.00" data-y="0.04" data-z="0.03"
                  aria-label="Tronco e logotipo">
                  2
                </button>
            <button class="hotspot" type="button" data-topic="braco" data-x="-0.15" data-y="-0.05" data-z="0.03"
                  aria-label="Ferramenta de montagem">
                  3
                </button>

            <button class="hotspot hotspot-danger" type="button" data-topic="mao" data-x="0.15" data-y="-0.05"
            data-z="0.03"       aria-label="Mão mecânica esquerda">
                  4
                </button>
          </div>
      <section id="info-panel" class="info-panel hidden" aria-live="polite">
            <button id="close-panel" class="close-button" type="button" aria-label="Fechar painel">
                </button>
            <small>PONTO DO TORNO</small>
            <h2 id="info-title">
                  Componente
                </h2>
            <p id="info-text">
                  Descrição.
                </p>
            <p id="info-detail" class="detail">
                  Detalhe.
                </p>
          </section>

    <!-- Mude apenas a linha do mindar-image adicionando as duas regras de UI -->
    <a-scene id="ar-scene" ar-event-listener
        mindar-image="imageTargetSrc: static/assets/targets/robo.mind; autoStart: false; uiLoading: no; uiScanning: no;"
        color-space="sRGB" renderer="colorManagement: true;" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false" embedded>
        <a-camera id="ar-camera" position="0 0 0" look-controls="enabled: false">
        </a-camera>
        <a-entity id="target" mindar-image-target="targetIndex: 0">
        </a-entity>

          </a-scene>
      
    <script src="static/js/app.js"></script>
</body>

</html>
