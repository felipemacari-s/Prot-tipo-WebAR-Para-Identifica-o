<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - Manutenção Industrial</title>
    
    <!-- Bibliotecas A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <!-- Painel de UI sobreposto à câmara -->
    <div id="painel-info" class="oculto">
        <h2 id="painel-titulo">Informação</h2>
        <div id="painel-conteudo"></div>
        <button id="btn-fechar">Fechar</button>
    </div>

    <!-- Cena WebAR -->
    <a-scene mindar-image="imageTargetSrc: ./assets/targets/robo.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false">
            <!-- Cursor para permitir interações de toque/clique -->
            <a-entity cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .interativo"></a-entity>
        </a-camera>

        <!-- Entidade ancorada ao target da imagem -->
        <a-entity mindar-image-target="targetIndex: 0" id="target-robo">
            
            <!-- Hotspot 1: Identificação (Azul) -->
            <a-circle id="hs-identificacao" class="interativo" color="#2196F3" radius="0.1" position="-0.5 0.5 0"></a-circle>
            
            <!-- Hotspot 2: Componentes (Verde) -->
            <a-circle id="hs-componentes" class="interativo" color="#4CAF50" radius="0.1" position="0.5 0.5 0"></a-circle>
            
            <!-- Hotspot 3: Manutenção (Amarelo) -->
            <a-circle id="hs-manutencao" class="interativo" color="#FFEB3B" radius="0.1" position="-0.5 -0.5 0"></a-circle>
            
            <!-- Hotspot 4: Monitoramento via API (Vermelho) -->
            <a-circle id="hs-monitoramento" class="interativo" color="#F44336" radius="0.1" position="0.5 -0.5 0"></a-circle>

        </a-entity>
    </a-scene>
</body>
</html>
